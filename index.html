    <script>
      // Theme before first paint. A saved choice (from clicking the circle) wins;
      // otherwise first-time visitors get dark mode when it is night in San Francisco.
      (function () {
        var NIGHT_START = 18; // 6 PM
        var NIGHT_END = 6; // 6 AM
        var theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "dark" && theme !== "light") {
          var hour = Number(
            new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", hour: "numeric", hourCycle: "h23" }).format(new Date())
          );
          theme = hour >= NIGHT_START || hour < NIGHT_END ? "dark" : "light";
        }
        if (theme === "dark") document.documentElement.dataset.theme = "dark";
      })();
    </script>
